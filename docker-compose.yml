# Local development infrastructure for NomadIQ.
#
# Credentials below are LOCAL DEVELOPMENT ONLY. They match
# src/backend/IdentityService/appsettings.Development.json and must
# never be reused for staging/production environments.
services:
  identity-db:
    image: postgres:16
    container_name: nomadiq-identity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nomadiq_identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nomadiq_identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nomadiq_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nomadiq_identity_db_data:
